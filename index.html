        { id: "cm_116", sec: "cm", secTitle: "Complement Multiplu", num: "116", text: "Acestea sunt surse emboligene în ischemia acută:", type: "cm", opts: { a: "cavitățile inimii", b: "anevrism miocardic", c: "emboli paradoxali(sistemul venos profund)", d: "tromboflebită superficială", e: "anevrism abdominal" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_117", sec: "cm", secTitle: "Complement Multiplu", num: "117", text: "Cele mai fregvente trombolitice sunt:", type: "cm", opts: { a: "recombinant tissue-plasminogen activator(rt-PA)", b: "urokinază", c: "streptokinază", d: "warfarina", e: "reteplase" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_118", sec: "cm", secTitle: "Complement Multiplu", num: "118", text: "Urmatoarele sunt caracteristice ale arteriopaiei obliterante:", type: "cm", opts: { a: "durere cu debut brusc", b: "stenoza urmată de ocluzie", c: "multilevel disease", d: "dezvoltarea circulației colaterale", e: "claudicație" }, ans: ["b", "c", "d", "e"] },
        { id: "cm_119", sec: "cm", secTitle: "Complement Multiplu", num: "119", text: "Complicatii posibile aparute în tratamentul chirurgical a bolii aorto-iliacă sunt:", type: "cm", opts: { a: "Tromboza", b: "Ateroembolism intraoperator", c: "Ruptura arterei poplitee", d: "Lezarea duodenului adiacent", e: "Lezarea venei cave inferioare si a venei iliace" }, ans: ["a", "b", "d", "e"] },
        { id: "cm_120", sec: "cm", secTitle: "Complement Multiplu", num: "120", text: "Semnele clinice de mai jos se datoreaza insuficientei venoase cornice:", type: "cm", opts: { a: "vene varicoase", b: "teleangectazii", c: "absenta pulsului", d: "edem", e: "vene reticulare" }, ans: ["a", "b", "d", "e"] },

        // ================= COMPLEMENT MULTIPLU 2022 (1 - 28) =================
        { id: "cm2022_1", sec: "cm2022", secTitle: "Teste noi 2022 (CM)", num: "1", text: "În circulația fetală: Marea majoritate a sângelui deoxigenat din vena cavă superioară pătrunde primar în?", type: "cm", opts: { a: "Atriul drept", b: "Foramen ovale patent", c: "Atriul stâng", d: "Valva tricuspidă", e: "Ventriculul drept" }, ans: ["a", "d", "e"] },
        { id: "cm2022_2", sec: "cm2022", secTitle: "Teste noi 2022 (CM)", num: "2", text: "În circulația fetală: Marea majoritate a sângelui deoxigenat din ventriculul drept este direcţionat în?", type: "cm", opts: { a: "Valva arterei pulmonare", b: "Ramul drept arterei pulmonare", c: "Ramul stâng arterei pulmonare", d: "Ductul arterial", e: "Aorta toracică descendentă" }, ans: ["a", "d", "e"] },

    let currentFilter = 'all';

    function renderQuestions() {
        const feed = document.getElementById("quizFeed");
        feed.innerHTML = "";

        const filtered = currentFilter === 'all' 
            ? quizDatabase 
            : quizDatabase.filter(q => q.sec === currentFilter);

        let lastSec = "";

        filtered.forEach((q) => {
            if (q.sec !== lastSec) {
                lastSec = q.sec;
                const header = document.createElement("div");
                header.className = "bg-slate-800 text-white font-bold text-lg px-5 py-3 rounded-xl shadow-sm mt-8 mb-4 flex items-center justify-between";
                header.innerHTML = `<span>${q.secTitle}</span><span class="text-xs font-normal text-slate-300">Secțiune</span>`;
                feed.appendChild(header);
            }

            const card = document.createElement("div");
            card.className = "q-card bg-white rounded-2xl p-6 border border-slate-200 shadow-sm transition-all duration-200 hover:border-slate-300";
            card.id = `card_${q.id}`;

            const badgeColor = q.type === "cs" ? "bg-blue-100 text-blue-700 border-blue-200" : "bg-purple-100 text-purple-700 border-purple-200";
            const badgeLabel = q.type === "cs" ? "Complement Simplu" : "Complement Multiplu";

            let optsHtml = `<div class="space-y-2 mt-4">`;
            for (let key in q.opts) {
                const inputType = q.type === "cs" ? "radio" : "checkbox";
                optsHtml += `
                    <label id="lbl_${q.id}_${key}" class="flex items-start p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition-all duration-150">
                        <input type="${inputType}" name="${q.id}" value="${key}" onchange="updateProgress()" class="mt-1 h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-slate-300 rounded-sm">
                        <span class="ml-3 text-sm text-slate-700 leading-relaxed"><strong class="text-slate-900">${key.toUpperCase()}.</strong> ${q.opts[key]}</span>
                    </label>
                `;
            }
            optsHtml += `</div>`;

            card.innerHTML = `
                <div class="flex items-center justify-between gap-2 mb-2">
                    <span class="text-xs font-bold px-2.5 py-1 rounded-md border ${badgeColor}">${badgeLabel}</span>
                    <span class="text-xs text-slate-400 font-mono">#${q.num}</span>
                </div>
                <h3 class="text-base font-semibold text-slate-900">${q.num}. ${q.text}</h3>
                ${optsHtml}
            `;

            feed.appendChild(card);
        });

        document.getElementById("totalQuestionsText").innerText = `/ ${quizDatabase.length} completate`;
        updateProgress();
    }

    function filterSection(sec) {
        currentFilter = sec;
        ['all', 'cs', 'cs2022', 'cm', 'cm2022'].forEach(t => {
            const btn = document.getElementById(`tab-${t}`);
            if (t === sec) {
                btn.className = "px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 text-white shadow-sm transition-colors";
            } else {
                btn.className = "px-4 py-2 rounded-lg text-sm font-medium bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 transition-colors";
            }
        });
        renderQuestions();
    }

    function updateProgress() {
        const answeredSet = new Set();
        quizDatabase.forEach(q => {
            const checked = document.querySelectorAll(`input[name="${q.id}"]:checked`);
            if (checked.length > 0) answeredSet.add(q.id);
        });

        const count = answeredSet.size;
        const total = quizDatabase.length;
        const percent = Math.round((count / total) * 100);

        document.getElementById("answeredCount").innerText = count;
        document.getElementById("progressBar").style.width = `${percent}%`;
    }

    function checkAnswers() {
        let totalScore = 0;
        let answeredTotal = 0;

        quizDatabase.forEach((q) => {
            const checkedInputs = Array.from(document.querySelectorAll(`input[name="${q.id}"]:checked`));
            const userSelections = checkedInputs.map(i => i.value);

            if (userSelections.length > 0) answeredTotal++;

            // Clean existing styles for labels
            for (let key in q.opts) {
                const label = document.getElementById(`lbl_${q.id}_${key}`);
                if (label) {
                    label.classList.remove("correct-opt", "wrong-opt", "missed-opt");
                }
            }

            const isCorrect = q.ans.length === userSelections.length && q.ans.every(val => userSelections.includes(val));

            if (isCorrect) {
                totalScore++;
                userSelections.forEach(key => {
                    const lbl = document.getElementById(`lbl_${q.id}_${key}`);
                    if (lbl) lbl.classList.add("correct-opt");
                });
            } else {
                // Highlight user wrong selections
                userSelections.forEach(key => {
                    const lbl = document.getElementById(`lbl_${q.id}_${key}`);
                    if (lbl && !q.ans.includes(key)) {
                        lbl.classList.add("wrong-opt");
                    }
                });

                // Highlight correct missed answers
                q.ans.forEach(key => {
                    const lbl = document.getElementById(`lbl_${q.id}_${key}`);
                    if (lbl) {
                        lbl.classList.add("missed-opt");
                    }
                });
            }
        });

        // Show Score Banner
        const banner = document.getElementById("scoreBanner");
        const pct = Math.round((totalScore / quizDatabase.length) * 100);
        
        banner.classList.remove("hidden", "bg-emerald-50", "border-emerald-200", "text-emerald-900", "bg-amber-50", "border-amber-200", "text-amber-900");

        if (pct >= 80) {
            banner.classList.add("bg-emerald-50", "border-emerald-200", "text-emerald-900");
            document.getElementById("scoreTitle").innerText = "Excelent!";
            document.getElementById("scoreSub").innerText = "Ați demonstrat o cunoaștere foarte bună a materiei.";
        } else {
            banner.classList.add("bg-amber-50", "border-amber-200", "text-amber-900");
            document.getElementById("scoreTitle").innerText = "Rezultat Test Verificat";
            document.getElementById("scoreSub").innerText = "Verificați întrebările marcate cu roșu/galben pentru a revizui răspunsurile greșite.";
        }

        document.getElementById("scorePercentage").innerText = `${pct}%`;
        document.getElementById("scoreFraction").innerText = `${totalScore} din ${quizDatabase.length} corecte`;

        banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // Initialize on load
    window.onload = function() {
        renderQuestions();
    };
    </script>
