        { id: "cs_47", sec: "cs", secTitle: "Complement Simplu", num: "47", text: "Care din următoarele este tumoarea ce afectează valvele cardiace?", type: "cs", opts: { a: "Mixoma", b: "Fibroma", c: "Fibroelastoma", d: "Rabdomioma", e: "Lipoma" }, ans: ["c"] },
        { id: "cs_48", sec: "cs", secTitle: "Complement Simplu", num: "48", text: "Cea mai frecventă localizare a tumorilor mediastinale este în:", type: "cs", opts: { a: "Mediastinul anterior", b: "Mediastinul posterior", c: "Mediastinul superior", d: "Mediastinul mediu", e: "Tumorile mediastinale au repartiție egală în compartimentele mediastinale" }, ans: ["a"] },
        { id: "cs_49", sec: "cs", secTitle: "Complement Simplu", num: "49", text: "Cel mai frecvent tip de tumoră mediastinală întîlnit în mediastinul anterior este:", type: "cs", opts: { a: "Tumorile neurogene", b: "Timomul", c: "Mixomul", d: "Tumorile din celule germinative", e: "Metastaze din glanda tiroidă" }, ans: ["b"] },
        { id: "cs_50", sec: "cs", secTitle: "Complement Simplu", num: "50", text: "Investigarea specifică de rutină pentru determinarea prezenței și localizării tumorilor mediastinale este:", type: "cs", opts: { a: "Radiografia toracică", b: "Ecografia cardiacă", c: "Tomografia computerizată toracică simplă", d: "Scintigrafia", e: "Tomografia computerizată toracică în regim angio" }, ans: ["c"] },
        { id: "cs_51", sec: "cs", secTitle: "Complement Simplu", num: "51", text: "Nu este simptom al tumorilor mediastinale:", type: "cs", opts: { a: "Voce răgușită", b: "Tamponada cardiacă", c: "Tusea", d: "Disfagia", e: "Palpitații" }, ans: ["e"] },
        { id: "cs_52", sec: "cs", secTitle: "Complement Simplu", num: "52", text: "Tumorile cele mai frecvente în mediastinul posterior sunt:", type: "cs", opts: { a: "Tumorile neurogene benigne", b: "Tumorile neurogene maligne", c: "Tumorile din celule germinative benigne", d: "Tumorile din celul geminative maligne", e: "Limfoamele" }, ans: ["a"] },
        { id: "cs_53", sec: "cs", secTitle: "Complement Simplu", num: "53", text: "Hipertensiunea pulmonara este consecinta a:", type: "cs", opts: { a: "Hipovolemiei in circuitul mic", b: "Hipervolemiei in circuitul mic", c: "Hipervolemia in circuitul mare", d: "Hipovolemia in circuitul mare", e: "Nici una din cele enumerate" }, ans: ["b"] },
        { id: "cs_54", sec: "cs", secTitle: "Complement Simplu", num: "54", text: "Presiunea pulmonară normală este:", type: "cs", opts: { a: "5-10 mm Hg", b: "15-20 mm Hg", c: "20-25 mm Hg", d: "30-40 mm Hg", e: "0-5 mm Hg" }, ans: ["b"] },
        { id: "cs_55", sec: "cs", secTitle: "Complement Simplu", num: "55", text: "Hipertensiunea pulmonară este definită în modul următor:", type: "cs", opts: { a: "Creşterea presiunii arteriale pulmonare medii mai mult decît 25 mm Hg în repaos, determinată la cataterism cardiac", b: "Creşterea presiunii arteriale pulmonare sistolice mai mult decît 25 mm Hg la efort, determinată la cataterism cardiac", c: "Creşterea presiunii arteriale pulmonare medii mai mult decît 15 mm Hg în repaos, determinată la cataterism cardiac", d: "Creşterea presiunii venoase pulmonare medii mai mult decît 25 mm Hg în repaos, determinată la radiografie pulmonară", e: "Creşterea presiunii venoase pulmonare medii mai mult decît 15 mm Hg la efort, determinată la cataterism cardiac" }, ans: ["a"] },
        { id: "cs_56", sec: "cs", secTitle: "Complement Simplu", num: "56", text: "Care poate fi una din cauzele HTP determinată de patologia părților stîngi a cardului?", type: "cs", opts: { a: "Insuficienţa valvei tricuspide", b: "Stenoza valvei mitrale", c: "Boala Ebstein", d: "Defect septal atrial", e: "Transpoziția de vase magistrale" }, ans: ["b"] },
        { id: "cs_57", sec: "cs", secTitle: "Complement Simplu", num: "57", text: "Homogrefele sunt :", type: "cs", opts: { a: "Prelevate de la pacientul în cauză", b: "Prelevate de la cadavre umane", c: "Realizate din pericard porcin", d: "Toate cele de mai sus", e: "Nici una" }, ans: ["b"] },
        { id: "cs_58", sec: "cs", secTitle: "Complement Simplu", num: "58", text: "Sunt cauze de insuficienţă aortică acută, cu excepţia:", type: "cs", opts: { a: "Endocardită acută", b: "Disecţia de aortă", c: "Boala Marfan", d: "Aortită sifilitică", e: "Traumatism toracic" }, ans: ["c"] },
        { id: "cs_59", sec: "cs", secTitle: "Complement Simplu", num: "59", text: "În evoluţia unui infarct miocardic acut apariţia unui suflu holosistolic în spițe de roată este sugestivă pentru :", type: "cs", opts: { a: "Insuficienţă mitrală ischemică", b: "Infarct de ventricul drept asociat unui infarct inferior", c: "Ruptura peretelui liber ventricular", d: "Ruptura septului interventricular", e: "Embolie pulmonară cu regurgitare tricuspidiană severă" }, ans: ["d"] },
        { id: "cs_60", sec: "cs", secTitle: "Complement Simplu", num: "60", text: "Triada de factori predispozanti pentru tromboza venoasa, descrisa de Virchow cuprinde:", type: "cs", opts: { a: "edemul membrelor inferioare, hipercoagulabilitatea, staza;", b: "traumatismul local al peretelui vaselor, sarcina, hipercoagulabilitatea;", c: "traumatismul local al peretelui vaselor, hipercoagulabilitatea, staza;", d: "obezitatea, hipercoagulabilitatea, sarcina;", e: "sarcina, staza, hipercoagulabilitatea." }, ans: ["c"] },
        { id: "cs_61", sec: "cs", secTitle: "Complement Simplu", num: "61", text: "Care din următoarele afirmaţii sunt adevărate?", type: "cs", opts: { a: "Arteriografia prin puncție Seldinger se face cel mai frecvent prin puncția arterei brahiale", b: "Insuficiența renală nu este o contraindicație pentru arteriografie", c: "Calea femurala este de preferat atunci cind pulsarile la femurale sunt slabe sau absente.", d: "Punctia directa a unei proteze vasculare este de preferat.", e: "Arteriografie cross-over este indicata în cazul absentei pulsului la femurala contralaterala" }, ans: ["e"] },
        { id: "cs_62", sec: "cs", secTitle: "Complement Simplu", num: "62", text: "Pentru salvarea extremității în condiții optime, intervalul de timp scurs de la instalarea ischemiei la instruirea tratamentului (respectiv la restabilirea fluxului arterial) trebuie sa fie mai scurt de:", type: "cs", opts: { a: "1-2 ore", b: "4-6 ore", c: "6-8 ore", d: "10-12 ore", e: "12-24 ore" }, ans: ["b"] },
        { id: "cs_63", sec: "cs", secTitle: "Complement Simplu", num: "63", text: "Dat fiind faptul că la majoritatea pacienților care au suferit traumatisme vasculare circulația colaterala este slab dezvoltata (pacienții sunt mai degrabă tineri, cu artere normale) ischemia ireversibila apare:", type: "cs", opts: { a: "Mai precoce", b: "Mai tardiv", c: "Nu poate apărea", d: "Cu urmare a traumatismului maselor musculare", e: "Ca urmare a leziunilor nervoase" }, ans: ["a"] },
        { id: "cs_64", sec: "cs", secTitle: "Complement Simplu", num: "64", text: "O serie de factori influențează direct prognosticul în tratamentele vasculare, cu excepția:", type: "cs", opts: { a: "Intervalul de timp scurs între momentul traumatismului și intervenția terapeutică adecvată", b: "Vîrsta tînără", c: "Localizarea anatomică", d: "Leziunile ososoase asociate", e: "Leziunile nervoase asociate." }, ans: ["b"] },
        { id: "cs_65", sec: "cs", secTitle: "Complement Simplu", num: "65", text: "Următoarele afirmaţii sunt false:", type: "cs", opts: { a: "În traumatismele vasculare aerteriografia este procedeul diagnostic cel mai precis pentru diagnosticul unei leziuni vasculae.", b: "arteriografie negativă exclude o leziune arterială la un pacient cu semne echivoce", c: "Arteriografia precizează sediul exact, natura și extensia leiunii/leziunilor vasculare în vederea tratamentului.", d: "Arteriografia este indicată la pacienții instabili hemodinamic", e: "Ateriografia intraoperatorie este de preferat." }, ans: ["d"] },
        { id: "cs_66", sec: "cs", secTitle: "Complement Simplu", num: "66", text: "Atitudinea terapeutica in cazul leziunilor arteriale asociate cu alte leziuni presupune următoarele, cu excepția:", type: "cs", opts: { a: "Daca la leziunea arteriala se asociaza si o leziune venoasa aceasta din urma va fi rezolvată in general prima", b: "In cazul asocierii leziunilor osoase, leziune vascuala va fi rezolvata prima, indiferent de gravitatea ischemiei.", c: "Leziunile asociate care ameninta viata printre putinele indicatii pentru ligatura si nu pentru repararea arteriala..", d: "indicatie pentru amputatie este reprezentata de pierderea osoasă pe întindere mai mare de 6 cm", e: "Prezenta socului sau leziunilor multiple asociate reprezenta indicații relative pentru amputație." }, ans: ["b"] },
        { id: "cs_67", sec: "cs", secTitle: "Complement Simplu", num: "67", text: "Primul gest terapeutic in ischemia acuta prin embolie trebuie sa fie:", type: "cs", opts: { a: "Administrarea unui bolus de heparina", b: "Incalizrea memrbului ischemic", c: "Efectuarea embolectomiei cti mai rapid posibil.", d: "Administraea unor analgetice puternice de tipul morfinei sau petidinei", e: "Adminisrarea de manitol alaturi de alcalinizarea urinii pentru prevenirea insuficientei renale acute." }, ans: ["a"] },
        { id: "cs_68", sec: "cs", secTitle: "Complement Simplu", num: "68", text: "Selectați afirmaţia falsă:", type: "cs", opts: { a: "Trombocitopenia indusă de heparină are prognostic vital și funcțional bun", b: "Trombocitopenia apare la 1-2% din tratamentele cu heparină, de obicei între ziua a 5-a și a 7-a și manifestă prin fenomene trombotice venoase sau arteriale", c: "Mecanismul de apariție al trombocitopeniei heparin-induse este imuno-alergic", d: "Riscul de trombocitopenie este similar pentru toate tipurile de heparină", e: "Primul gest terapeutic este în trombocitopeniile induse de heparină este oprirea administrării" }, ans: ["a"] },
        { id: "cs_69", sec: "cs", secTitle: "Complement Simplu", num: "69", text: "Tratamentul cu AVK este contraindicat în următoarele situații, cu excepția:", type: "cs", opts: { a: "În cazul existenței unei diateze hemoragic", b: "Hipertensiunea arterială malign", c: "În cazul în care contextul psiho-social al pacientului nu permite supravegherea adecvată a tratamentului", d: "La vârste <75 ani", e: "La vârste >75 ani" }, ans: ["d"] },
        { id: "cs_70", sec: "cs", secTitle: "Complement Simplu", num: "70", text: "Care din următoarele afirmaţii sunt false?", type: "cs", opts: { a: "Principalul determinant al permeabilității pe termen lung al unui grefon este starea patului vascular periferic", b: "Permeabilitatea la 5 ani a unui grefon femuropopliteu depăşeşte 90%", c: "Permeabilitatea la 5 ani a unui grefon aortofemural depăşeşte 90%", d: "Bypassul extraanatomic este unui procedeu folosit la pacienții cu risc crescut și la care se are în vedere evitarea unei intervenții intraabdominale majore", e: "Cea mai buna patență pe termen lung este observată în cazul folosirii grefoanelor venoase" }, ans: ["b"] },
        { id: "cs_71", sec: "cs", secTitle: "Complement Simplu", num: "71", text: "Alegerea grefonului vascular nu ține cont de:", type: "cs", opts: { a: "Diametrul vasului nativ ce va fi înlocuit sau bypassat", b: "Prezența infecției", c: "Străbaterea sau nu a unei regiuni articulare", d: "Disponibilitatea sau nu a unui conduct autogen", e: "Costul unui grefon sintetic" }, ans: ["e"] },
        { id: "cs_72", sec: "cs", secTitle: "Complement Simplu", num: "72", text: "În cazurile de boală aorto-iliacă cu ischemie severă se remarcă, cu excepția:", type: "cs", opts: { a: "eritroza de declivitate", b: "paloarea la ridicarea membrului", c: "modificari trofice ale pielii la nivelul piciorului și gambei", d: "Prezența pulsului periferic", e: "Absența pulsului periferic" }, ans: ["d"] },
        { id: "cs_73", sec: "cs", secTitle: "Complement Simplu", num: "73", text: "Termenul de ischemie critică a membrului este definit prin:", type: "cs", opts: { a: "durere de repaos continuă necesitând analgezie cu durată peste două saptamâni", b: "ulcer ischemic", c: "gangrena piciorului", d: "Presiunea sistolică la nivelul gleznei mai mare de 50 mmHg", e: "Presiunea sistolică la nivelul gleznei mai mica de 50 mmHg" }, ans: ["e"] },
        { id: "cs_74", sec: "cs", secTitle: "Complement Simplu", num: "74", text: "Care este atitudinea corectă în sindromul de compartiment:", type: "cs", opts: { a: "faciotomie", b: "miomectomie", c: "drenajul", d: "compresie", e: "observația" }, ans: ["a"] },
        { id: "cs_75", sec: "cs", secTitle: "Complement Simplu", num: "75", text: "Cea mai frecventă complicație apărută în urma revascularizării arteriale este:", type: "cs", opts: { a: "edemul de reperfuzie", b: "infecția", c: "parestezia", d: "dermatoscelroza", e: "nici una de mai sus" }, ans: ["a"] },
        { id: "cs_76", sec: "cs", secTitle: "Complement Simplu", num: "76", text: "Cînd putem exclude un sindrom de compartiment?", type: "cs", opts: { a: "presiunea în compartiment >30-35 mmHg", b: "presiunea în compartiment 10-15 mmHg", c: "traumatisme arterio-venoase combinate", d: "edem masiv", e: "absenta fluxului capilar" }, ans: ["b"] },
        { id: "cs_77", sec: "cs", secTitle: "Complement Simplu", num: "77", text: "Care din urmatoarele explorări este cea mai fidelă în detectarea leziunilor axului arterial al membrelor inferioare:", type: "cs", opts: { a: "angiografie prin rezonanță magnetică", b: "computer-tomografie", c: "arteriogarfie prin puncție Seldinger", d: "venografie", e: "limfografie" }, ans: ["c"] },
        { id: "cs_78", sec: "cs", secTitle: "Complement Simplu", num: "78", text: "Care din următoarele cauze este cea mai frecvent întâlnită în ischemia acută traumatică a membrelor inferioare:", type: "cs", opts: { a: "anevrism micotic", b: "traumatisme închise", c: "traumatisme deschise", d: "disecție de aorta.", e: "spasm arterial." }, ans: ["c"] },
        { id: "cs_79", sec: "cs", secTitle: "Complement Simplu", num: "79", text: "Următoarele afirmaţii referitoare la tromboflebită superficială sunt false:", type: "cs", opts: { a: "poate fi determinate de traumatisme", b: "tromboflebită superficială este întîlnită într-o serie de boli maligne", c: "poate avea character migrator în boala Buerger", d: "se complică de cele mai multe ori cu embolie pulmonară", e: "tromboflebita venelor superficiale ale sînului(boala Mondor) este o entitae foarte rară." }, ans: ["d"] },
        { id: "cs_80", sec: "cs", secTitle: "Complement Simplu", num: "80", text: "Tratamentul cu anticoagulante orale în tromboză venoasă profundă se conduce în funcție de:", type: "cs", opts: { a: "INR", b: "Timp Howel", c: "Timp de sîngerare", d: "Valoarea antitrombinei III", e: "APTT" }, ans: ["a"] },

        // ================= COMPLEMENT SIMPLU 2022 (1 - 34) =================
        { id: "cs2022_1", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "1", text: "În circulația fetală: Câte artere ombilicale sunt prezente la făt?", type: "cs", opts: { a: "1", b: "2", c: "3", d: "4", e: "5" }, ans: ["b"] },
        { id: "cs2022_2", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "2", text: "În circulația fetală: Câte vene ombilicale sunt prezente la făt?", type: "cs", opts: { a: "1", b: "2", c: "3", d: "4", e: "5" }, ans: ["a"] },
        { id: "cs2022_3", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "3", text: "În circulația fetală: Arterele ombilicale la făt își au originea din?", type: "cs", opts: { a: "Aortă", b: "Arterele iliace", c: "Ventriculul stâng", d: "Atriul stâng", e: "Arterele renale" }, ans: ["b"] },
        { id: "cs2022_4", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "4", text: "Majoritatea sângelui din vena ombilicală ocolește ficatul prin intermediul?", type: "cs", opts: { a: "Direct prin vena cavă inferioară", b: "Ductul venos", c: "Vena hemiazigos", d: "Vena azigos", e: "Vena cavă superioară" }, ans: ["b"] },
        { id: "cs2022_5", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "5", text: "În circulația fetală: Sângele din vena cavă inferioară este direcționat în atriul stâng prin foramen ovale patent de către?", type: "cs", opts: { a: "Valva tricuspidă", b: "Valva mitrală", c: "Valva lui Eustachio", d: "Valva lui Thebesius", e: "Valva aortică" }, ans: ["c"] },
        { id: "cs2022_6", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "6", text: "În circulația fetala: Direcționarea fluxului sangvin prin ductul arterial este determinat de?", type: "cs", opts: { a: "Vârsta fatului în perioada intrauterină", b: "Poziția anatomică al ductului arterial", c: "Rezistența vasculară pulmonară mărită", d: "Concentrația mică de oxigen în ventriculul drept", e: "Funcția bună a valvei tricuspide" }, ans: ["c"] },
        { id: "cs2022_7", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "7", text: "Coardele tendinoase a valvei mitrale unesc?", type: "cs", opts: { a: "Muşchii papilari cu cuspele valvei mitrale", b: "Miocardul ventriculului stâng cu cuspele valvei mitrale", c: "Muşchii papilari cu inelul valvei mitrale", d: "Miocardul ventriculului stâng cu inelul valvei mitrale", e: "Inelul valvei mitrale cu cuspele valvei mitrale" }, ans: ["a"] },
        { id: "cs2022_8", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "8", text: "Care arteră coronariană poate fi lezată la plasarea suturilor pe inelul valvei mitrale în chirurgia cardiacă?", type: "cs", opts: { a: "Artera descendentă anterioară", b: "Artera circumflexă", c: "Arera coronariană dreptă", d: "Artera coronariană stângă", e: "Artera descendentă posterioară" }, ans: ["b"] },
        { id: "cs2022_9", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "9", text: "Principala funcție a coardelor tendinoase este?", type: "cs", opts: { a: "Previne prolabarea cuspelor în perioada sistolei ventriculare", b: "Previne prolabarea cuspelor în perioada sistolei atriale", c: "Previne prolabarea cuspelor în perioada diastolei ventriculare", d: "Previne disfuncția sistolică a atriului", e: "Previne disfuncția inelului valvular" }, ans: ["a"] },
        { id: "cs2022_10", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "10", text: "În jurul inelului anterior a valvei tricuspide, în șanțul atrio-ventricular anterior trece următoarea arteră coronariană?", type: "cs", opts: { a: "Artera descendentă anterioară", b: "Artera circumflexă", c: "Artera coronariană dreaptă", d: "Artera coronariană stângă", e: "Artera descendentă posterioară" }, ans: ["c"] },
        { id: "cs2022_11", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "11", text: "Care arteră coronariană poate fi lezată la plasarea suturilor pe inelul valvei tricuspide în chirurgia cardiacă?", type: "cs", opts: { a: "Artera descendentă anterioară", b: "Artera circumflexă", c: "Artera coronariană dreaptă", d: "Artera coronariană stângă", e: "Artera descendentă posterioară" }, ans: ["c"] },
        { id: "cs2022_12", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "12", text: "Ce structură anatomico-funcțională poate fi lezată la plasarea suturilor în regiunea vârfului triunghiului Koch?", type: "cs", opts: { a: "Lezarea arterei coronariene drepte", b: "Lezarea nodului atrioventricular", c: "Lezarea arterei circumflexe", d: "Lezarea sinusului coronarian", e: "Lezarea nodului sino-atrial" }, ans: ["b"] },
        { id: "cs2022_13", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "13", text: "Abordul chirurgical la valva tricuspidă se efectuează prin?", type: "cs", opts: { a: "Atriotomie stângă", b: "Atriotomie dreaptă", c: "Septotomie", d: "Ventriculotomie dreaptă", e: "Ventriculotomie stângă" }, ans: ["b"] },
        { id: "cs2022_14", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "14", text: "Cine din iluștrii chirurgi considera că „Chirurgul care va decide să aplice o sutură pe cord riscă să piardă stima colegilor săi\"?", type: "cs", opts: { a: "Theodor Billroth", b: "Ludwig Rehn", c: "Friedrich Trendelenburg", d: "Robert Gross", e: "Alfred Blalock" }, ans: ["a"] },
        { id: "cs2022_15", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "15", text: "Cine a aplicat prima sutură pe cord (oficial recunoscut)?", type: "cs", opts: { a: "Åke Senning", b: "Ludwig Rehn", c: "Robert Gross", d: "Alain Carpentier", e: "René Favaloro" }, ans: ["b"] },
        { id: "cs2022_16", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "16", text: "Cine a descris pentru prima dată operaţia pentru embolectomie pulmonară în anul 1908?", type: "cs", opts: { a: "Friedrich Trendelenburg", b: "Robert Gross", c: "Alain Carpentier", d: "René Favaloro", e: "Alfred Blalock" }, ans: ["a"] },
        { id: "cs2022_17", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "17", text: "Prima inlaturare (rezectie) de Aneurism Aortic în anul 1931 a fost efectuata de către?", type: "cs", opts: { a: "C.W. Lillehei", b: "Robert Gross", c: "Emil Karl Frey", d: "Ferdinand Sauerbruch", e: "Dwight Harken" }, ans: ["c"] },
        { id: "cs2022_18", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "18", text: "Închiderea chirurgicală a ductului Botallo în anul 1938 a fost efectuată de către?", type: "cs", opts: { a: "Emil Karl Frey in Düsseldorf si Robert Gross in Boston", b: "Friedrich Trendelenburg în Berlin și Henry T. Bahnson în Pittsburgh", c: "Henry Swan în Denver și Ernst Derra în Düsseldorf", d: "Åke Senning în Stockholm și Dwight Harken in Boston", e: "Albert Starr în Portland și Alain Carpentier în Franţa" }, ans: ["a"] },
        { id: "cs2022_19", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "19", text: "Prima anastomoză vasculară intersistemică a fost efectuată în 1944 de către chirurgul?", type: "cs", opts: { a: "Friedrich Trendelenburg", b: "Robert Gross", c: "Alain Carpentier", d: "René Favaloro", e: "Alfred Blalock" }, ans: ["e"] },
        { id: "cs2022_20", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "20", text: "Cine a aplicat hipotermia generala a corpului pentru a corecta malformația cardiacă congenitală cu scopul profilaxiei hipoxiei cerebrale?", type: "cs", opts: { a: "Emil Karl Frey in Düsseldorf si Robert Gross in Boston", b: "Friedrich Trendelenburg în Berlin și Henry T. Bahnson în Pittsburgh", c: "Henry Swan în Denver și Ernst Derra în Düsseldorf", d: "Åke Senning în Stockholm şi Dwight Harken in Boston", e: "Albert Starr în Portland și Alain Carpentier în Franţa" }, ans: ["c"] },
        { id: "cs2022_21", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "21", text: "Cine este considerat întemeitorul operațiilor pe cord deschis?", type: "cs", opts: { a: "C.W. Lillehei", b: "Robert Gross", c: "Emil Karl Frey", d: "Ferdinand Sauerbruch", e: "Dwight Harken" }, ans: ["a"] },
        { id: "cs2022_22", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "22", text: "Primul cardiostimulator a fost implantat în anul 1958 de către?", type: "cs", opts: { a: "Åke Senning", b: "Ludwig Rehn", c: "Robert Gross", d: "Alain Carpentier", e: "René Favaloro" }, ans: ["a"] },
        { id: "cs2022_23", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "23", text: "Prima anastomoză între artera mamară internă și ramul interventricular anterior a fost aplicată în anul 1967 de către?", type: "cs", opts: { a: "A.P. Kolessov", b: "Robert Gross", c: "Alain Carpentier", d: "René Favaloro", e: "Alfred Blalock" }, ans: ["a"] },
        { id: "cs2022_24", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "24", text: "Primul transplant de cord a fost efectuat în?", type: "cs", opts: { a: "Statele Unite ale Americii", b: "Germania", c: "Africa de Sud", d: "India", e: "China" }, ans: ["c"] },
        { id: "cs2022_25", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "25", text: "Ce grad de severitate a bolii în stenoza aortică indică un gradient mediu de presiune de 45 mm Hg?", type: "cs", opts: { a: "Medie", b: "Uşoară", c: "Severă", d: "Critică", e: "Grad neimportant" }, ans: ["c"] },
        { id: "cs2022_26", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "26", text: "Ce modificare structurală a inimii este cel mai frecvent asociată la orice pacient cu stenoză aortică, indiferent de etiologie?", type: "cs", opts: { a: "Dilatarea cavităților ventricului stâng", b: "Hipertrofie concentrică a ventriculului stâng", c: "Hipertrofia atrială stângă", d: "Hipertrofia ventriculului drept", e: "Dilatarea atriului stâng" }, ans: ["b"] },
        { id: "cs2022_27", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "27", text: "Ce patologie cardiacă concomitentă poate fi depistată la bolnavul cu stenoză aortică de etiologie reumatismală?", type: "cs", opts: { a: "Stenoza valvei tricuspide", b: "Stenoza valvei mitrale", c: "Insuficienţa valvei mitrale", d: "Stenoza valvei arterei pulmonare", e: "Patologia pericardului" }, ans: ["b"] },
        { id: "cs2022_28", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "28", text: "Care este mecanismul sau etiologia simptomelor anginei în cadrul stenozei aortice?", type: "cs", opts: { a: "Necesitatea în oxigen în miocard este mai mare decât aportul oxigenului", b: "Hipotensiunea în aorta ascendentă", c: "Compresia extravazală a arterelor coronariene", d: "Ateroscleroza arterelor coronariene", e: "Dilatarea poststenotică aortei ascendente" }, ans: ["a"] },
        { id: "cs2022_29", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "29", text: "Care este mecanismul sau etiologia clasică a simptomelor sincopei în cadrul stenozei aortice?", type: "cs", opts: { a: "Hipoperfuzia cerebrală din cauza debitului cardiac scăzut", b: "Aritmia ventriculară", c: "Aritmia atrială", d: "Sincope vasovagale", e: "Bradiaritmiii" }, ans: ["a"] },
        { id: "cs2022_30", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "30", text: "Care este tratamentul de primă linie pentru un pacient simptomatic cu stenoză aortică severă?", type: "cs", opts: { a: "Inhibitori enzimei de conversie a Angiotenzinei", b: "Beta-blocantele", c: "Diuretice", d: "Spironolactonă", e: "Înlocuirea valvei aortice" }, ans: ["e"] },
        { id: "cs2022_31", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "31", text: "Care din următoarele tratamente nu trebuie amânat în insuficienţa acută de valvă aortică?", type: "cs", opts: { a: "Preparate medicamentoase care micșorează postsarcina", b: "Preparate beta-blocante", c: "Tratamentul chirurgical", d: "Aplicarea balonului de contrapulsație", e: "Preparate medicamentoase cu funcție inotropă" }, ans: ["c"] },
        { id: "cs2022_32", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "32", text: "Insuficienţa aortică cronică de etiologie reumatismală prezintă una din următoarele caracteristici?", type: "cs", opts: { a: "Afectarea distrofică a valvei aortice şi/sau a inelului aortic si/sau a aortei ascendente", b: "Este etiologia cea mai frecventă în ţările industrializate", c: "Valvele sunt îngroşate, apoi calcificate, comisurile fuzionează, se retractă, iar mobilitatea lor este diminuată", d: "Se asociază cu bicuspidia aortică", e: "Apare frecvent în sindromul Marfan" }, ans: ["c"] },
        { id: "cs2022_33", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "33", text: "Pulsul lui Corrigan, caracteristic pentru insuficienţa aortică cronică severă, se caracterizează prin?", type: "cs", opts: { a: "Tumefacția sistolică și colapsul rapid diastolic al arterei carotide la pacient în poziție ortostatică", b: "Turgescența venelor jugulare", c: "Pulsația capilară determinată la vârful degetelor sau buzelor", d: "Pulsația diminuată pe arterele femurale", e: "Vizualizarea șocului apexian" }, ans: ["a"] },
        { id: "cs2022_34", sec: "cs2022", secTitle: "Teste noi 2022 (CS)", num: "34", text: "Pulsul lui Quincke, descris în insuficienţa aortică cronică severă, se caracterizează prin?", type: "cs", opts: { a: "Tumefacția sistolică și colapsul rapid diastolic al arterei carotide la pacient în poziție ortostatică", b: "Turgescența venelor jugulare", c: "Pulsația capilară determinată la vârful degetelor sau buzelor", d: "Pulsația diminuată pe arterele femurale", e: "Vizualizarea șocului apexian" }, ans: ["c"] },

        // ================= COMPLEMENT MULTIPLU (1 - 120) =================
        { id: "cm_1", sec: "cm", secTitle: "Complement Multiplu", num: "1", text: "Canalul arterial permeabil duce la:", type: "cm", opts: { a: "Hipervolemie in circuitul mic", b: "Hipovolemie in circuitul mic", c: "Hipertensiune in circuitul mic", d: "Raspunsurile corecte A si B", e: "Toate cele enumerate" }, ans: ["a", "c"] },
        { id: "cm_2", sec: "cm", secTitle: "Complement Multiplu", num: "2", text: "Canalul arterial permeabil larg, se complica cel mai frecvent cu:", type: "cm", opts: { a: "Endocardita bacteriana", b: "Dereglari de ritm cardiac", c: "Hipertensiune pulmonara", d: "Insuficienta circulatorie", e: "Hipertensiune arterială" }, ans: ["a", "c", "d"] },
        { id: "cm_3", sec: "cm", secTitle: "Complement Multiplu", num: "3", text: "Indicatie pentru interventie chirurgicala de inchiderea a DSV la un copil mai mic de 1 an, este:", type: "cm", opts: { a: "Şunt mare stinga dreapta", b: "Cresterea tensiunii pulmonare", c: "Infectii respiratorii frecvente", d: "Hipotrofie", e: "Vârsta copilului" }, ans: ["a", "b", "c", "d"] },
        { id: "cm_4", sec: "cm", secTitle: "Complement Multiplu", num: "4", text: "Pentru canalul atrioventricular de tip complet este caracteristic:", type: "cm", opts: { a: "Comunicare la nivel de atrii", b: "Comunicare la nivel de ventricule", c: "Inele fibroase a valvelor atrioventriculare sunt formate corect", d: "Clivajul cuspelor valvelor tricuspide si mitrale formeaza doua cuspe ventral si dorsala", e: "Comunicare comuna atrio-ventriculara" }, ans: ["a", "b", "d", "e"] },
        { id: "cm_5", sec: "cm", secTitle: "Complement Multiplu", num: "5", text: "Angiografic, la stenoza valvulara izolata a arterei pulmonare se evidentiaza:", type: "cm", opts: { a: "Dilatarea poststenotica a trunchiului arterei pulmonare", b: "Ingustarea tractului de ejectie a ventriculului drept in sistola", c: "Dilatarea tractului de ejectie a ventriculului drept in diastole", d: "Regurgitarea substantei de contrast in atriul drept", e: "Ingustarea aortei ascendente" }, ans: ["a", "b", "c"] },
        { id: "cm_6", sec: "cm", secTitle: "Complement Multiplu", num: "6", text: "Malformaţii cardiace congenitale necianogene se caracterizeaza prin:", type: "cm", opts: { a: "Cianoză difuză la efort fizic", b: "Dificultăți în a adăuga în greutate", c: "Insuficienţă cardiacă congestivă și supracirculația pulmonară", d: "Dificultăți la diferite exerciții fizice", e: "Prezența policitemiei" }, ans: ["b", "c", "d"] },
        { id: "cm_7", sec: "cm", secTitle: "Complement Multiplu", num: "7", text: "Exista urmatoarele tipuri de defecte septale ventriculare (DSV):", type: "cm", opts: { a: "Perimembranos (sau membranos)", b: "Infundibular (subpulmonar sau supracristal DSV)", c: "DSV Muscular", d: "DSV tip ostium secundum", e: "Atrioventricular DSV" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_8", sec: "cm", secTitle: "Complement Multiplu", num: "8", text: "Urmatoarele sunt caracteristice pentru canalul atrio-ventricular:", type: "cm", opts: { a: "Tratamentul chirurgical este întotdeauna necesar.", b: "Îngustarea arterei pulmonare poate fi necesară la sugari prematuri sau sugari <5 kg.", c: "Corecția chirurgicală se face în timpul copilariei pentru a evita boala vasculară pulmonară ireversibilă.", d: "Mortalitate scăzută forma incompletă si mortalitate ridicata la canalul atrio-ventricular complet.", e: "Pacientul nu se operează imediat, ci se află la evidenta medicului de familie cit mai indelungat." }, ans: ["a", "b", "c", "d"] },
        { id: "cm_9", sec: "cm", secTitle: "Complement Multiplu", num: "9", text: "Din cele expuse, care metodele de tratament a canalului arterial permeabil:", type: "cm", opts: { a: "Tratamentul cu Indometacină, inhibitor al sintezei prostaglandinelor, poate fi utilizat la sugari prematuri.", b: "CAP-ul de dimensiuni medii necesită închiderea chirurgicală sau cu cateter.", c: "Se efectuează de obicei ligaturarea canalului de dimensiuni mari.", d: "Tratament cu perfuzie continuă de soluție Vasoprostan", e: "CAP de dimensiuni mici nu necesită tratament, ci doar monitorizare în dinamică." }, ans: ["a", "b", "c"] },
        { id: "cm_10", sec: "cm", secTitle: "Complement Multiplu", num: "10", text: "Stenoza de arteră pulmonară poate fi localizată:", type: "cm", opts: { a: "La nivelul ramurilor intrabronşice ale arterei pulmonare", b: "la nivelul valvei arterei pulmonare", c: "supravalvular, pe trunchiul arterei pulmonare", d: "la nivelul tractului de ejecție VD subvalvular", e: "la nivelul ramificării arterei pulmonare" }, ans: ["a", "b", "c", "d", "e"] },
        { id: "cm_11", sec: "cm", secTitle: "Complement Multiplu", num: "11", text: "Care afirmaţii în metodele de tratament al stenozei pulmonare sunt corecte:", type: "cm", opts: { a: "Stenoza AP uşoară nu necesită intervenție, ci doar urmărirea în dinamică.", b: "Valvuloplastia percutanată cu balon - metodă de elecție în strnozele medii și severe de AP", c: "Istmoplastia", d: "Corecție cu petec din pericard la eșecul valvuloplastie percutane cu balon, sau în malformații asociate", e: "Infundibulectomia" }, ans: ["a", "b", "d", "e"] },
        { id: "cm_12", sec: "cm", secTitle: "Complement Multiplu", num: "12", text: "Dintre următoarele, care investigații paraclince sunt specifice pentru aprecierea hemodinamicii MCC?", type: "cm", opts: { a: "Ecografia", b: "AngioCT", c: "RMN cardiac", d: "Radiografia toracică", e: "Cataterismul cardiac" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_13", sec: "cm", secTitle: "Complement Multiplu", num: "13", text: "Care, dintre cele enumerate, reprezintă tratament chirurgical pentru stenoza aortică supravalvulară?", type: "cm", opts: { a: "Aortoplastie cu petec în sinusul necoronarian", b: "Aortoplastie cu petec Y inversat", c: "Secționarea aortei, incizii în toate cele 3 sinusuri, corespunzător adaptării aortei distale, și reanastomoză.", d: "Operația Ross", e: "Protezarea valvei aortice cu proteză mecanică" }, ans: ["a", "b", "c"] },
        { id: "cm_14", sec: "cm", secTitle: "Complement Multiplu", num: "14", text: "Care sunt teoriile patogenetice pentru coarctația aortică?", type: "cm", opts: { a: "Teoria țesuturilor ductale", b: "Teoria hemodinamică", c: "Sindromul Turner", d: "Teoria genetică", e: "Teoria alimentației incorecte" }, ans: ["a", "b"] },
        { id: "cm_15", sec: "cm", secTitle: "Complement Multiplu", num: "15", text: "Care semne clinice sunt specifice pentru coarctația aortică:", type: "cm", opts: { a: "Gradientul de saturație între membrele superioara şi inferioare", b: "Gradientul de tensiune arterială între membrele superioara şi inferioare", c: "Gradientul de puls între membrele superioara şi inferioare", d: "Hipertrofia parții inferioare a trunchiului și membrelor inferioare", e: "Hipotrofia parții inferioare a trunchiului și membrelor inferioare" }, ans: ["b", "c", "e"] },
        { id: "cm_16", sec: "cm", secTitle: "Complement Multiplu", num: "16", text: "Malformație ductal- dependent este:", type: "cm", opts: { a: "Atrezia de arteră pulmonară", b: "Arcul aortic întrerupt", c: "Transpoziția vaselor magistrale", d: "Coarctația aortică critică", e: "Prezența circulației fetale persistența canalului arterial permeabil şi foramen ovale patent." }, ans: ["a", "b", "c", "d"] },
        { id: "cm_17", sec: "cm", secTitle: "Complement Multiplu", num: "17", text: "Specific pentru operațiile cardiochirurgicale este:", type: "cm", opts: { a: "Utilizarea circulației extracorporale", b: "Utilizarea dozei mari de heparină", c: "Anestezie rahidiană", d: "Racirea pacienților intraoperator", e: "Operații pe cord stopat" }, ans: ["a", "b", "d", "e"] },
        { id: "cm_18", sec: "cm", secTitle: "Complement Multiplu", num: "18", text: "Din cele enumerate, care sunt abordurile chirurgicale în chirurgia cardiacă:", type: "cm", opts: { a: "Sternotomia longitudinală", b: "Incizia McBourney", c: "Mini sternotomia", d: "Toracotomia stîngă", e: "Toractomia dreaptă" }, ans: ["a", "c", "d", "e"] },
        { id: "cm_19", sec: "cm", secTitle: "Complement Multiplu", num: "19", text: "Dintre următoarele, pentru inima fătului intrauterin, prezintă malformații congenitale:", type: "cm", opts: { a: "Prezența defectului septal ventricular", b: "Prezența foramen ovale patent și ductul Botallo", c: "Obstrucția aortei", d: "Nesepararea valvelor mitrale și tricuspide", e: "Drenarea venelor pulmonare în atriul drept" }, ans: ["a", "c", "d", "e"] },
        { id: "cm_20", sec: "cm", secTitle: "Complement Multiplu", num: "20", text: "Sunt malformații cardiace congenitale palide:", type: "cm", opts: { a: "DSA", b: "DSV", c: "Coarctația de aorta", d: "Atrezia de arteră pulmonară", e: "CAP" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_21", sec: "cm", secTitle: "Complement Multiplu", num: "21", text: "Care patologii prezintă leziuni obstructive ale părţilor stângi a inimii:", type: "cm", opts: { a: "Stenoză mitrală congenitală", b: "Stenoză aortică congenitală", c: "Coarctația aortică", d: "Întreruperea arcului aortic", e: "Stenoza congenitală a arterei pulmonare" }, ans: ["a", "b", "c", "d"] },
        { id: "cm_22", sec: "cm", secTitle: "Complement Multiplu", num: "22", text: "Care din cele enumerate nu sunt contraindicații absolute pentru intervenţie chirurgicală pe cord în cazul MCC palide:", type: "cm", opts: { a: "Prezența sindromului Eisenmeiger", b: "Prezența hipertensiunii pulmonare", c: "Dilatarea cavităților cordului", d: "Aritmiile cardiace", e: "Fracția de ejecție între 40% si 50%" }, ans: ["b", "c", "d", "e"] },
        { id: "cm_23", sec: "cm", secTitle: "Complement Multiplu", num: "23", text: "Tratament pentru coarctația aortică este:", type: "cm", opts: { a: "Angioplastia percutană cu balon", b: "Istmoplastia", c: "Rezecția coarctației cu anastomoză termino-terminală", d: "Rezecția coarctației cu interpozționarea unui grefon sintetic", e: "Angioplastia percutanată cu balon valvei arterei pulmonare" }, ans: ["a", "b", "c", "d"] },
        { id: "cm_24", sec: "cm", secTitle: "Complement Multiplu", num: "24", text: "De ce depind manifestările clinice în MCC palide?", type: "cm", opts: { a: "Dimensiunile defectelor", b: "Localizarea defectelor", c: "Rezistența vasculară pulmonară", d: "Fluxului sangvin prin defect", e: "Rezistența vasculară sistemică" }, ans: ["a", "b", "c", "d"] },
        { id: "cm_25", sec: "cm", secTitle: "Complement Multiplu", num: "25", text: "Care este indicaţie pentru treatment chirurgical al DSV?", type: "cm", opts: { a: "DSV fără efect la tratament medicamentos şi infecții respiratorii severe, frecvente.", b: "DSV cu HTP moderată sau severă", c: "DSV de orice mărime, cînd se asociază riscul de apariție a insuficienței valvulare aortice sau pulmonare.", d: "DSV larg cu semn clinică de retard ponderal sever", e: "DSV restrictiv" }, ans: ["a", "b", "c", "d"] },
        { id: "cm_26", sec: "cm", secTitle: "Complement Multiplu", num: "26", text: "Din cele enumerate, pentru tetrada Fallot este caracteristic:", type: "cm", opts: { a: "Miscarea septului interventricular conal inainte si spre stinga", b: "Hipertrofia structurilor ventriculului drept", c: "Ingustarea tractului de ejectie a ventriculului drept", d: "DSV restrictiv", e: "Dextrapozitia aortica" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_27", sec: "cm", secTitle: "Complement Multiplu", num: "27", text: "Hemodinamica circuitului mic in tetrada Fallot, nu se caracterizeaza prin:", type: "cm", opts: { a: "Flux pulmonar normal", b: "Flux pulmonar accentuat", c: "Flux pulmonar hipertensiv", d: "Flux pulmonar insaracit", e: "Flux pulmonar prin colaterale" }, ans: ["a", "b", "c"] },
        { id: "cm_28", sec: "cm", secTitle: "Complement Multiplu", num: "28", text: "Cateterizarea cardiacă in tetrada Fallot prezintă următoarele:", type: "cm", opts: { a: "Patrunderea cateterului din ventriculul drept in aorta", b: "Patrunderea ingreuiata a cateterului in artera pulmonara", c: "Scaderea presiunii sistolice in artera pulmonara", d: "Presiunea sistolica in ventriculul drept este mai mică decit in ventriculul sting", e: "Prezenta gradientului sistolic intre ventriculul drept si artera pulmonara" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_29", sec: "cm", secTitle: "Complement Multiplu", num: "29", text: "Accesul hipoxic în Tetralogia Fallot este condiționat de:", type: "cm", opts: { a: "Micşorarea rezistenței vasculare pulmonare", b: "Micşorarea rezistenței vasculare sistemice", c: "Mărirea rezistenței vasculare pulmonare", d: "Mărirea rezistenței vasculare sistemice", e: "Răspunsuri corecte: a, d" }, ans: ["b", "c"] },
        { id: "cm_30", sec: "cm", secTitle: "Complement Multiplu", num: "30", text: "Hipoxemia arterială conduce la:", type: "cm", opts: { a: "Hipoxemie pronunțată și glicoliză anaerobă", b: "Acumularea metaboliților acizi şi acidoză metabolică", c: "Peroxidarea lipidelor şi formarea radicalilor liberi", d: "Micşorarea nivelului hemoglobinei în sânge", e: "Hiperpotasemiei" }, ans: ["a", "b", "c"] },
        { id: "cm_31", sec: "cm", secTitle: "Complement Multiplu", num: "31", text: "La investigația radiografica in proiecție antero-posterioara, la pacienții cu tetrada Fallot, hilul pulmonar poate fi dilatat din contul următoarelor:", type: "cm", opts: { a: "Trunchiul arterei pulmonare", b: "Aorta ascendenta", c: "Vena cava superioara", d: "Prezența venei cave stângi", e: "Tractul de ejectie a ventriculului drept" }, ans: ["a", "b", "c", "d"] },
        { id: "cm_32", sec: "cm", secTitle: "Complement Multiplu", num: "32", text: "Anomalia Ebstein nu se caracterizeaza prin urmatoarea schimbare anatomica:", type: "cm", opts: { a: "Pozitionarea cuspelor valvei tricuspide in ventriculul drept", b: "Scurtarea coardelor si hipoplazia muschilor papilari a valvei tricuspide", c: "DSA tip OS, sau prezenta FOP", d: "Marirea in dimensiuni a camerelor cordului drept", e: "Drenarea anomala a venelor pulmonare" }, ans: ["e"] },
        { id: "cm_33", sec: "cm", secTitle: "Complement Multiplu", num: "33", text: "In maladia Ebstein, hemodinamica este caracterizata prin:", type: "cm", opts: { a: "Regurgitare la nivelul valvei tricuspide", b: "Şunt dreapta stinga la nivelul atriilor", c: "Hipoxemie moderata sau severa", d: "Insuficienta valvei mitrale", e: "Hipovolemie moderata la nivelul circuitului mic" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_34", sec: "cm", secTitle: "Complement Multiplu", num: "34", text: "Semnele clinice specifice pentru MCC cianogene sunt următoarele, cu excepția:", type: "cm", opts: { a: "Cianoza", b: "Apetitul scăzut", c: "Retardul de creştere", d: "Dispneea", e: "Răceli frecvente" }, ans: ["e"] },
        { id: "cm_35", sec: "cm", secTitle: "Complement Multiplu", num: "35", text: "Care din cauzele enumerate determină cianoza?", type: "cm", opts: { a: "Pulmonare", b: "Renale", c: "Cardiace", d: "Hematologice", e: "Patologii a SNC" }, ans: ["a", "c", "d", "e"] },
        { id: "cm_36", sec: "cm", secTitle: "Complement Multiplu", num: "36", text: "Care, din următoarele patologii, nu este MCC cu cianoză diferențiată?", type: "cm", opts: { a: "Canal atrio-ventricular", b: "Tetralogia Fallot", c: "Trunchi arterial comun", d: "Arc aortic întrerupt", e: "Atrezia de arteră pulmonară" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_37", sec: "cm", secTitle: "Complement Multiplu", num: "37", text: "Care din următoarele, este cauză de deces în evoluția MCC cianogene?", type: "cm", opts: { a: "Accesul hipoxic", b: "Progresarea cianozei", c: "Insuficienţa cardiacă", d: "Endocardita infecțioasă", e: "Pneumonia bilaterală" }, ans: ["a", "c", "d", "e"] },
        { id: "cm_38", sec: "cm", secTitle: "Complement Multiplu", num: "38", text: "Cele mai utilizate intervenții paliative pentru MCC cianogene sunt:", type: "cm", opts: { a: "Procedeul Rashkind", b: "Anastomoza intersistemică Blalock- Taussing", c: "Anastomoza intersistemică modificată Blalock - Taussing", d: "Banding-ul de arteră pulmonară", e: "Anastomoza Glenn" }, ans: ["a", "b", "c", "d", "e"] },
        { id: "cm_39", sec: "cm", secTitle: "Complement Multiplu", num: "39", text: "Dintre următoarele, sunt operații paliative:", type: "cm", opts: { a: "Procedeul Rashkind", b: "Anastomoza intersistemică Blalock-Taussing", c: "Switch-ul arterial", d: "Banding-ul de arteră pulmonară", e: "Anastomoza Glenn" }, ans: ["a", "b", "d", "e"] },
        { id: "cm_40", sec: "cm", secTitle: "Complement Multiplu", num: "40", text: "Cum se cupează criza hipoxică?", type: "cm", opts: { a: "Poziția genunchi - torace", b: "Administrarea oxigenului concentrat prin mască facială", c: "Calmarea copilului cu sedative", d: "Administrarea lichidelor intravenos în bolus", e: "Administrarea preparatelor spasmolitice" }, ans: ["a", "b", "c", "d"] },
        { id: "cm_41", sec: "cm", secTitle: "Complement Multiplu", num: "41", text: "Care, din următoarele, sunt etape în corecția radicală a Tetralogiei Fallot?", type: "cm", opts: { a: "Infundibulectomia", b: "Plastia DSV", c: "Lărgirea tractului de ejecție a ventricului drept", d: "Anastomozarea venei cave cu artera pulmonară", e: "Aplicarea homogrefelor în poziție pulmonară în caz de necesitate" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_42", sec: "cm", secTitle: "Complement Multiplu", num: "42", text: "Care din cele enumerate nu este caracteristica pentru transpoziția vaselor magistrale simplă?", type: "cm", opts: { a: "Aorta porneşte din ventriculul stâng, artera pulmonară din ventriculul drept", b: "Aorta pornește din ventriculul drept, artera pulmonară din ventricului sting", c: "Are loc amestecul circuitelor sangvine", d: "Ambele vase magistrale pornesc din ventriculul drept", e: "Ambele vase magistrale pornesc din ventriculul stîng" }, ans: ["a", "d", "e"] },
        { id: "cm_43", sec: "cm", secTitle: "Complement Multiplu", num: "43", text: "Procedeul Rashkind nu se caracterizează prin:", type: "cm", opts: { a: "Anastomozarea VCS la artera pulmonară", b: "Anastomoza între artera subclavie şi artera pulmonar", c: "Procedeu endovascular ce se finalizează cu \"ruperea\" septului interatrial", d: "Îngustarea arterei pulmonare", e: "Procedeu endovascular ce se finalizează cu lărgirea locului de coarctație aortică" }, ans: ["a", "b", "d", "e"] },
        { id: "cm_44", sec: "cm", secTitle: "Complement Multiplu", num: "44", text: "Prin ce formațiuni anatomice poate avea loc amestecarea sîngelui în transpoziția vaselor magistrale?", type: "cm", opts: { a: "Canal arterial permeabil", b: "Foramen ovale patent sau defect septal atrial", c: "Valva atrio-ventriculară comună", d: "Trunchiul arterial comun", e: "Defect septal ventricular" }, ans: ["a", "b", "e"] },
        { id: "cm_45", sec: "cm", secTitle: "Complement Multiplu", num: "45", text: "Care din următoarele este tip al drenajului pulmonar venos aberant?", type: "cm", opts: { a: "Tip supracardiac", b: "Tip intracardiac", c: "Tip infracardiac", d: "Tip aortal", e: "Tip atrial stâng" }, ans: ["a", "b", "c"] },
        { id: "cm_46", sec: "cm", secTitle: "Complement Multiplu", num: "46", text: "Care, din următoarele, este loc de drenaj al venelor pulmonare aberante?", type: "cm", opts: { a: "Vena cavă superioara", b: "Vena cavă inferioară", c: "Atriul drept", d: "Vena jugulară", e: "Vena femurală" }, ans: ["a", "b", "c"] },
        { id: "cm_47", sec: "cm", secTitle: "Complement Multiplu", num: "47", text: "Care dintre cele enumerate nu este caracteristica de bază pentru atrezia valvei tricuspide este:", type: "cm", opts: { a: "Lipsa comunicării între atriul drept si ventriculul drept", b: "Lipsa comunicării între atriul stîng si ventriculul stîng", c: "Hiperflux sangvin din atriul drept în ventricului drept", d: "Hiperflux sangvin spre artera pulmonară", e: "Circuitele sangvine sistemic și pulmonar nu comunică între ele" }, ans: ["b", "c", "d", "e"] },
        { id: "cm_48", sec: "cm", secTitle: "Complement Multiplu", num: "48", text: "Prin ce mecanism se asigura supraviețuirea copiilor cu atrezie de valvă tricuspidă?", type: "cm", opts: { a: "Amestecarea sîngelui prin valva comună ventriculo-arterială", b: "Amestecarea sîngelui prin DSA cu şuntarea dreapta - stînga", c: "Amestecarea sîngelui prin DSV cu şuntarea stânga - dreapta", d: "Amestecarea sîngelui prin canal arterial permeabil cu şuntare stânga - dreapta", e: "Toate cele enumerate" }, ans: ["b", "c", "d"] },
        { id: "cm_49", sec: "cm", secTitle: "Complement Multiplu", num: "49", text: "Prin ce se caracterizează operația Fontan?", type: "cm", opts: { a: "Anastomozarea venei cave superioare la artera pulmonară", b: "Anastomoza între artera subclavie și artera pulmonară", c: "Procedeu endovascular ce se finalizează cu \"ruperea\" septului interatrial", d: "Îngustarea arterei pulmonare", e: "Excluderea parților drepte ale cordului din ciclul cardiac prin anastomozarea venelor cave la artera pulmonară" }, ans: ["e"] },
        { id: "cm_50", sec: "cm", secTitle: "Complement Multiplu", num: "50", text: "Prin ce se caracterizează operația în con la valva tricuspidă?", type: "cm", opts: { a: "Anastomozarea VCS la artera pulmonară", b: "Repoziționarea cuspelor valvei tricuspide la 360° pe inelul nativ a valvei", c: "Procedeu endovascular ce se finalizează cu \"ruperea\" septului interatrial", d: "Rezecția cuspelor malpoziționate ale valvei tricuspide", e: "Suturarea porțiunii atrializate ventriculului drept" }, ans: ["b", "d", "e"] },
        { id: "cm_51", sec: "cm", secTitle: "Complement Multiplu", num: "51", text: "Drept mecanism compensator al malformațiilor cardiace cianogene cel mai frecvent se prezintă:", type: "cm", opts: { a: "Policitemia", b: "Anemia", c: "Scăderea coagulabilității", d: "Scăderea vîscozității sîngelui", e: "Hiperglobulinemie" }, ans: ["a"] },
        { id: "cm_52", sec: "cm", secTitle: "Complement Multiplu", num: "52", text: "Malformațiile cardiace congenitale sunt caracterizate prin:", type: "cm", opts: { a: "Defect structural, functional sau de poziție a cordului", b: "Defect izolat sau complex al cordului", c: "Prezent din momentul naşterii", d: "Se poate manifesta imediat sau mai tîrziu în viață", e: "Sub formă de complicații în timpul nașterii copilului" }, ans: ["a", "b", "c", "d"] },
        { id: "cm_53", sec: "cm", secTitle: "Complement Multiplu", num: "53", text: "Pentru malformațiile cardiace congenitale cianogene este caracteristic:", type: "cm", opts: { a: "Incidența de 8-10 la 1000 de naşteri la termen", b: "Riscul creşte la copii cu părinți ce suferă de MCC", c: "Este cea mai frecventă cauza a morbidității și mortalității neonatale", d: "Incidenţia creşte pentru naşterile premature", e: "Cianoza devine mai accentuate proportional cu vârsta copilului" }, ans: ["a", "b", "c", "d", "e"] },
        { id: "cm_54", sec: "cm", secTitle: "Complement Multiplu", num: "54", text: "Care tip de tumori cardiace este predominant?", type: "cm", opts: { a: "Primare mai des decît maligne", b: "Maligne mai frecvent decît benigne", c: "Din tumorile primare predominante sunt benigne", d: "Din tumorile primare predominante sunt maligne", e: "Toate răspunsurile sunt corecte" }, ans: ["c"] },
        { id: "cm_55", sec: "cm", secTitle: "Complement Multiplu", num: "55", text: "Care dintre cele enumerate fac parte din simptomele tumorilor cardiace?", type: "cm", opts: { a: "Simptome sistemice (febră, scăderea masei corporale etc)", b: "Simptome embolice (embolizare în artera pulmonară sau arterele cerebrale)", c: "Simptome dispeptice (grețuri, lipsa poftei de mîncare)", d: "Simptome cardiace (ocluzia fluxului sangvin, dereglări de ritm)", e: "Simptome secundare metastazării tumorii (sindromul venei cave superioare etc)" }, ans: ["a", "b", "d", "e"] },
        { id: "cm_56", sec: "cm", secTitle: "Complement Multiplu", num: "56", text: "Complexul Corney este caracterizat prin:", type: "cm", opts: { a: "Patologie autosomal dominantă", b: "Multiple mixoame cardiace", c: "Mixoame extracardiace (piele, sîn)", d: "Hiperactivitatea glandelor endocrine", e: "Hiperactivitatea glandelor exocrine" }, ans: ["a", "b", "c", "d"] },
        { id: "cm_57", sec: "cm", secTitle: "Complement Multiplu", num: "57", text: "Care din următoarele este tumoarea ce afectează valvele cardiace?", type: "cm", opts: { a: "Mixoma", b: "Fibroma", c: "Fibroelastoma", d: "Rabdomioma", e: "Lipoma" }, ans: ["c"] },
        { id: "cm_58", sec: "cm", secTitle: "Complement Multiplu", num: "58", text: "Cel mai frecvent tumorile cardiace secundare sunt originare din:", type: "cm", opts: { a: "Melanomă", b: "Cancer mamar", c: "Cancer renal", d: "Limfom", e: "Lipom" }, ans: ["a", "b", "c", "d"] },
        { id: "cm_59", sec: "cm", secTitle: "Complement Multiplu", num: "59", text: "Simptomele a tumorilor mediastinale sunt:", type: "cm", opts: { a: "Voce răgușită", b: "Tamponada cardiacă", c: "Tusea", d: "Disfagia", e: "Palpitații" }, ans: ["a", "b", "c", "d"] },
        { id: "cm_60", sec: "cm", secTitle: "Complement Multiplu", num: "60", text: "Prognosticul pentru tumorile cardiace primare maligne:", type: "cm", opts: { a: "Este negativ, cauzat de creşterea rapidă intramurală a tumorilor", b: "Depinde de reactivitatea la chimioterapie", c: "Este de obicei pînă la un an", d: "Este agravat de producerea rapidă a metastazelor", e: "Este favorabil, caracterizat prin regresia rapidă a tumorilor" }, ans: ["a", "b", "c", "d"] },
        { id: "cm_61", sec: "cm", secTitle: "Complement Multiplu", num: "61", text: "Tratamentul chirurgical al tumorilor mediastinale şi cardiace:", type: "cm", opts: { a: "Este indicat pentru orice tip de tumoare", b: "Depinde de localizarea şi stadiul de progresie a tumorii", c: "Se recomandă chimioterapia ca adjuvant terapeutic", d: "Se execută prin sternotomie în cazul tumorilor mediastinale anterioare și prin toractomie în cazul tumorilor mediastinale posterioare", e: "Tratamentul chirurgical este indicat în dependență de vârsta pacientului" }, ans: ["b", "c", "d"] },
        { id: "cm_62", sec: "cm", secTitle: "Complement Multiplu", num: "62", text: "Hipertensiunea in circuitul mic duce la:", type: "cm", opts: { a: "La hipertofia stratului mediu a vaselor mici pulmonare", b: "La proliferarea excesiva a intimei vaselor pulmonare", c: "La sclerozarea stratului intern a vaselor pulmonare mici", d: "La subtierea stratului mediu a vaselor mici pulmonare", e: "La dezvoltarea vaselor colaterale pulmonare" }, ans: ["a", "b", "c"] },
        { id: "cm_63", sec: "cm", secTitle: "Complement Multiplu", num: "63", text: "Accentuarea zgomotului II la artera pulmonara, este semn de:", type: "cm", opts: { a: "Şunt mare stinga dreapta", b: "Şunt dreapta stinga", c: "Hipertensiune pulmonara", d: "Egalarea şunturilor", e: "Nu are legatura cu nimic din cele enumerate" }, ans: ["a", "c"] },
        { id: "cm_64", sec: "cm", secTitle: "Complement Multiplu", num: "64", text: "Care din următoarele este consecință a hipertensiunii pulmonare:", type: "cm", opts: { a: "Insuficienţa parților drepte a cordului", b: "Insuficienţă hepatică", c: "Insuficienţa părților stîngi a cordului", d: "Insuficiența respiratorie", e: "Insuficiența renală" }, ans: ["a", "b", "d"] },
        { id: "cm_65", sec: "cm", secTitle: "Complement Multiplu", num: "65", text: "Sunt contraindicaţii relative pentru adminsitrarea de heparine:", type: "cm", opts: { a: "Chirurgie recenta", b: "Asocierea cu AINS", c: "Injecţii intramusculare", d: "Pericardita", e: "Disecția aortică" }, ans: ["a", "b", "c", "d"] },
        { id: "cm_66", sec: "cm", secTitle: "Complement Multiplu", num: "66", text: "Care din urmatoarele etiologii enumerate mai jos este cauza de embolie pulmonara netrombotica:", type: "cm", opts: { a: "embolia tumorala", b: "embolia cu lichid amniotic", c: "tromboza venoasa profunda izolata a gambei", d: "embolia grasa", e: "embolia gazoasa" }, ans: ["a", "b", "d", "e"] },
        { id: "cm_67", sec: "cm", secTitle: "Complement Multiplu", num: "67", text: "Factorii etiologici al revărsatului pleural nesupurativ sunt:", type: "cm", opts: { a: "Trauma canalului limfatic toracic (chilotoraxul)", b: "Traumatismul toracelui cu lezarea pleurei, arterelor intercostale, parenchimului pulmonar (hemotoraxul)", c: "Revarsatul pleural pancreatogen", d: "Ruperea abcesului pulmonar în cavitatea pleurala", e: "Revarsatul pleural malign (metastatic)" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_68", sec: "cm", secTitle: "Complement Multiplu", num: "68", text: "Care din cele enumerate sunt metode de electie de investigatie pentru stabilirea aspectului revarsatului pleural:", type: "cm", opts: { a: "Toracocenteza", b: "Recoltarea lichidului pentru examenul citologic după puncția pleurală", c: "Recoltarea lichidului pentru examenul biochimic după puncția pleurală", d: "Investigațiile cu radionuclizi", e: "Ultrasonografia" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_69", sec: "cm", secTitle: "Complement Multiplu", num: "69", text: "Care din afirmatiile enumerate sunt adresate pneumotoraxului spontan primitiv (idiopatic):", type: "cm", opts: { a: "Este o urgenta medico-chirurgicala", b: "Survine pe leziuni preexistente", c: "Apare brusc", d: "Ca regula fara o cauza cunoscuta anterior", e: "Se întâlneste preponderent la copii" }, ans: ["a", "c", "d"] },
        { id: "cm_70", sec: "cm", secTitle: "Complement Multiplu", num: "70", text: "Care sunt conditiile principale pentru survenirea pneumotoraxului spontan:", type: "cm", opts: { a: "Existenta unui loc de minima rezistenta", b: "Vârsta", c: "Interventia unui element declansator (efort fizic, tuse)", d: "Existenta bolilor asociate", e: "Depinde de genul pacientului" }, ans: ["a", "c"] },
        { id: "cm_71", sec: "cm", secTitle: "Complement Multiplu", num: "71", text: "Gradul ischemiei determinată de obstacol este variabil, în funcție de diverși factori:", type: "cm", opts: { a: "Sediul si întinderea obstacolului", b: "Viteza de constituire a obstacolului", c: "Distrugerea colateralelor", d: "Vîrsta pacientului", e: "Tromboza extensivă" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_72", sec: "cm", secTitle: "Complement Multiplu", num: "72", text: "Dintre explorări non-invazive ale patului aterial fac parte:", type: "cm", opts: { a: "Examenul Doppler", b: "Angio CT", c: "Angio RMN", d: "Aterografia prin puncție Seldinger", e: "Examenul Triplex" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_73", sec: "cm", secTitle: "Complement Multiplu", num: "73", text: "Complicatiile locale în arteriografia prin puncţie Seldinger sunt reprezentate de următoarele:", type: "cm", opts: { a: "Hematoame", b: "Fistule arterio-venoase", c: "Isecție, ocluzie vasculară și embolii periferice", d: "Insuficiența renală acută", e: "Pseudoanevrisme" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_74", sec: "cm", secTitle: "Complement Multiplu", num: "74", text: "În condițiile unui arbore arterial normal anatomic arteriografia oferă următoarele informații:", type: "cm", opts: { a: "Localizarea precisă a leziunilor", b: "Existenţa leziunilor unice sau multiple", c: "Existenta circulației colaterale", d: "Poate stabili originea embolică sau trombotică a unei ischemii acute", e: "Starea patului vascular distal" }, ans: ["a", "b", "c", "d", "e"] },
        { id: "cm_75", sec: "cm", secTitle: "Complement Multiplu", num: "75", text: "Traumatismele vasculare cu prognosticul cel mai bun sunt următoarele:", type: "cm", opts: { a: "Plăgile vasculare simple", b: "Plăgile înjunghiate", c: "Rupturle vasculare", d: "Contuziile arteriale", e: "Plăgile vasculare iatrogene" }, ans: ["a", "b", "e"] },
        { id: "cm_76", sec: "cm", secTitle: "Complement Multiplu", num: "76", text: "Ca principii generale de tratament în traumatismele vasculare sunt adevărate următoarele:", type: "cm", opts: { a: "Toți pacienții cu traumatisme vasculare trebuie evaluați pentru prezența altor leziuni în vederea ierarhizării tratamentului", b: "Şocul hemoragic este frevent prezent la bolnavii cu traumatisme vasculare ale membrelor", c: "Trebuie folosite garourile în scopul asigurării hemostazei", d: "Echilibrarea hemodinamică trebuie începută imediat și pe cît posibil obținută preoperator", e: "Trebuie în primul rînd excluse sau tratate leziunile care amenință viața" }, ans: ["a", "b", "d", "e"] },
        { id: "cm_77", sec: "cm", secTitle: "Complement Multiplu", num: "77", text: "Pacienții la care există manifestări datorate lezării unor vase importante necesita tratament chirurgical imediat. Care din următoarele afirmaţii adevărate?", type: "cm", opts: { a: "Prima măsură în cadrul intervenției chirurgicale este controlul proximal si distal la nivelul leziunii", b: "La nivelul vasului lezat trebuie cautata prezenta trombozei, in cazul existentei acestei, trombii trebuie indepartati cu ajutorul sondei Fogarty", c: "Odata obtinut controlul arterial, vasul lezat va fi excizat până in zona sanatoasa.", d: "Repararea ateriala si venoasa se realizeaza de obicei prin interpozitia unui graft, de preferat sintetic (e PTFE)", e: "Repararea arterial si venoasa se realizeaza de obicei prin interpozitia unui graft autolog." }, ans: ["a", "b", "c", "e"] },
        { id: "cm_78", sec: "cm", secTitle: "Complement Multiplu", num: "78", text: "Care din urmatoarele afirmatii referitoare la traumatismele vasculare sunt adevărate:", type: "cm", opts: { a: "extremitate fara sensibilitate si motricitate necesita de obicei amputație in cazul in care exista destrucție nervoasa importanta", b: "Extremitățile traumatizante sunt susceptibile sa dezvolte sindromul acut de compartiment", c: "Evaluarea precisa si corecta a sindromului de compartiment se face prin măsurarea directa a presiunii in compartiment", d: "Prezenta socului sau a leziunilor multiple asociate reprezinta indicatii absolute pentru amputatie", e: "Leziune vasculara in sine nu este factorul decesiv pentru amputatie." }, ans: ["a", "b", "c", "e"] },
        { id: "cm_79", sec: "cm", secTitle: "Complement Multiplu", num: "79", text: "Insuficienţa arteriala acuta este in marea majoritate a cazurilor rezultatul obstructiei intrinseci printr-un tromb. Urmatoarele afirmati sunt adevarate:", type: "cm", opts: { a: "Cea mai frecventa sursa de emboli este cordul", b: "Se poate produce embolie cu continutul placilor de aterom-ateromemboie sau sindromul degetelor albastre", c: "Manifestarile clinice ale ocluziei arteriae acute prin tromboza sunt mai severe decit in cazul altor etiologii.", d: "Tromboza venoasa profunda poate cauza o embolie arteriala paradoxala.", e: "Cauza majora de ischemie acuta periferica este embolia" }, ans: ["a", "b", "d", "e"] },
        { id: "cm_80", sec: "cm", secTitle: "Complement Multiplu", num: "80", text: "Semnele clinice cardinale în ischemia acută:", type: "cm", opts: { a: "Durere", b: "Parastezii", c: "Paloare", d: "Prezenta puslului distal de nivelul ocluziei", e: "Raceala tegumentelor" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_81", sec: "cm", secTitle: "Complement Multiplu", num: "81", text: "Urmatoarele afirmaţii sunt adevărate:", type: "cm", opts: { a: "In cazurile de ischemie acuta severa, unde diagnosticul este evident si suspiciunea cu privire la etiologie puternica, nu sunt necesare alte investigații paraclinice pentru a stabili indicatia terapeutica.", b: "Având in vedere ca inima este sursa principala de emboli, examinarea functiei cardio-pulmonare este esențială.", c: "Examenul ecografic (in special examenul Duplex) este util mai ales pentru stabilirea existentei trombozei venoase asociate.", d: "Succesul pe termen lung nu depinde de controlul susrselor emboliilor", e: "Modificarea consistentei masei musculare semnifica un prognostic prost." }, ans: ["a", "b", "c", "e"] },
        { id: "cm_82", sec: "cm", secTitle: "Complement Multiplu", num: "82", text: "Urmatoaele afirmatii referiotoare la ischemia acuta periferică sunt adevarate:", type: "cm", opts: { a: "Administrare de heparina previne propagarea distala a trombului", b: "Exremitatile ischemice trebuie ferite nu doar de frig, dar si de caldura sau presiunea exercitata asupra lor.", c: "Fluxul retrograd (fluxul de singe care curge din extremitatea distalaa arterei dupa inlaturarea obstructiei) semnifica un pat vascular distal efecient.", d: "In cazul existentei trombozei venoase, indepartarea tromblui venos trebuie efectuata dupa de restabilirea fluxului aterial.", e: "Protejarea patului vascular situat distal de obstructie este prima etapta a tratamentului in ischemia acută" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_83", sec: "cm", secTitle: "Complement Multiplu", num: "83", text: "Care din urmatoarele afimatii nu sunt false?", type: "cm", opts: { a: "Pentru a fi efecienta, embolectomia trebuie indicata si efectuarea precoce, in primele 6 ore.", b: "Fasciotomiile de decompresiune sunt indicate preventiv in toate iscemiile acute.", c: "Embolectomia se efectueaza de obicei sub anestezie locala, mai ales ca majoritatea pacientilor sunt bătrâni si cu stare generala proastă.", d: "Heparina reduce la minimum propagarea trombozei si favorizeaza liza naturala a trombului ca si dezvoltarea circuatiei colaterale.", e: "revascuarizare arteriala efecienta este exclusa in cazul lipsei unui flux distal adecvat." }, ans: ["a", "c", "d", "e"] },
        { id: "cm_84", sec: "cm", secTitle: "Complement Multiplu", num: "84", text: "Despre disectia acută de aortă sunt adevărate următoarele afirmaţii:", type: "cm", opts: { a: "Hipertensiunea arteriala este factorul favorizant cel mai frecvent incriminat in producerea disecției acute de aortă.", b: "Incidența sindromului Marfan în disectiile de aortă este între 4-15%", c: "Necroza mediei (degerescenta cistica a mediei) se gaseste in 20% din cazurile de disectia aortica.", d: "De cele mai multe ori disectia aortica este asimptomatica si poate trece neobservata", e: "Boala anuloectazianta a radacinii aortice poate fi conditia anatomica preexistentă unei disecții de aorta." }, ans: ["a", "b", "c", "e"] },
        { id: "cm_85", sec: "cm", secTitle: "Complement Multiplu", num: "85", text: "Urmatoarele afirmatii sunt adevarata:", type: "cm", opts: { a: "Bicuspidia artica se asociaza frecvent cu disectia acuta de aorta", b: "Traumatisme toracice ichise pot determina disetie de aorta", c: "Jumatatae din disectiile ce surivn la femeia tînără (de virsta sub 40 de ani) intereseaza gravidele.", d: "Tensiunea arteriala scazuta este regula la pacientii cu disectie de aorta.", e: "Traumatismele iatrogene din cursul chirurgiei cardiac pot stala bazadisectiei de aorta." }, ans: ["a", "b", "c", "e"] },
        { id: "cm_86", sec: "cm", secTitle: "Complement Multiplu", num: "86", text: "In disectia acuta de aorta sunt valabile urmatoarele:", type: "cm", opts: { a: "Ruptura peretelui extern (adventitial) al lumenului fals se produce cel mai frecvent in pericard sau in cavitatea pleurala stinga.", b: "Pacienții cu disectie de tip A sunt, in genera mai tiner si includ pacientii cu sindrom Marfan si ectazie anulo-aortică.", c: "Disectie de tip B se intalneste, de regula, la barbatide virsta medie sau virstnici.", d: "Insuficenta artica este rara in cazul disectiei aortei proximale.", e: "Disectia la gravid survine de obicei in trimestrul al II-lea sau chiar in cursul travaliului." }, ans: ["a", "b", "c"] },
        { id: "cm_87", sec: "cm", secTitle: "Complement Multiplu", num: "87", text: "O serie de factori influențează mortalitatea preoperatorie in disecția acuta de aorta:", type: "cm", opts: { a: "Intervalul de timp intre diagnostic si operatie.", b: "Exitenta tamponadei cardiace", c: "Existenta insuficientei renale acute.", d: "Existenta insuficientei aortice preoperatorii", e: "Infarctul acut de miocard." }, ans: ["a", "b", "c", "e"] },
        { id: "cm_88", sec: "cm", secTitle: "Complement Multiplu", num: "88", text: "In cazul rupturii traumatice a aortei toracice, la patru categorii de pacienți se amina intervenția chirurgicală:", type: "cm", opts: { a: "Pacientii cu leziuni cerebrale severe.", b: "Pacientii in stare septica", c: "Pacientii cu arsuri extinse", d: "Pacientii cu traumatisme severe ale plaminului sting", e: "Pacientii cu traumatisme severe ale plaminului drept." }, ans: ["a", "b", "c", "d"] },
        { id: "cm_89", sec: "cm", secTitle: "Complement Multiplu", num: "89", text: "Metodele non-invazive de explorare vasculară sunt următoarele:", type: "cm", opts: { a: "măsurarea indicelui gleznă-braț", b: "pletismografia", c: "Examenul Doppler", d: "Arteriografia", e: "Măsurarea presiunii arteriale digitale" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_90", sec: "cm", secTitle: "Complement Multiplu", num: "90", text: "Tromboliza terapeutică este utilizată în mod esenţial în următoarele situații:", type: "cm", opts: { a: "În tratamentul infarctului acut de miocard", b: "În tratamentul emboliei pulmonare", c: "În trombozele venoase profunde cu debut mai mare de 14 zile", d: "În trombozele venoase profunde cu debut mai mic de 14 zile", e: "În trombozele arteriale acute" }, ans: ["a", "b", "d", "e"] },
        { id: "cm_91", sec: "cm", secTitle: "Complement Multiplu", num: "91", text: "Principalele contraindicații ale trombolizei sunt:", type: "cm", opts: { a: "Antecedente cerebro-medulare: traumatisme, anevrisme, chirurgie, neoplasme,", b: "accident vascular cerebral", c: "Hemoragie necontrolată", d: "Hipotensiune arterială", e: "Hipertensiune arterială" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_92", sec: "cm", secTitle: "Complement Multiplu", num: "92", text: "Următoarele afirmaţii referitoare la boala aorto-iliacă sunt adevărate:", type: "cm", opts: { a: "claudicația intermitentă este localizată la nivelul feselor, şoldului, coapselor și gambelor", b: "claudicația distală (la nivelul gambei) exclude leziunea aorto-iliacă", c: "tipul I de boală aorto-iliacă presupune limitarea procesului patologic la bifurcația aortei și arterele iliace", d: "Tipul III de boală aorto-iliacă presupune pe lângă afectarea aortei și iliacelor și arterelor infrainghinale", e: "Pe lângă claudicaţia intermitentă, bărbații cu boală aorto-iliacă mai pot prezenta impotența" }, ans: ["a", "c", "d", "e"] },
        { id: "cm_93", sec: "cm", secTitle: "Complement Multiplu", num: "93", text: "Pacienții cu boala aorto-iliacă manifestată prin claudicație intermitentă moderată sau ușoară vor beneficia de următoarele măsuri terapeutice conservative:", type: "cm", opts: { a: "renunțarea la fumat", b: "exerciții fizice zilnice", c: "scădere ponderală", d: "Intervenție chirurgicală d'amblee", e: "Consum hidric zilnic" }, ans: ["a", "b", "c"] },
        { id: "cm_94", sec: "cm", secTitle: "Complement Multiplu", num: "94", text: "Vârsta și tarele asociate la pacienții cu boala aorto-iliacă pot indica o anumită tehnică alternativă de revascularizare:", type: "cm", opts: { a: "bypass axilo-femural", b: "aterectomie", c: "angioplastie endoluminală", d: "Bypass aorto-femural", e: "Bypass femuro-femural" }, ans: ["a", "c", "e"] },
        { id: "cm_95", sec: "cm", secTitle: "Complement Multiplu", num: "95", text: "Următoarele afirmaţii referitoare la boala aterosclerotică obstructivă sunt adevărate:", type: "cm", opts: { a: "Evoluţia naturală a bolii obstructive cronice infrainghinale este invariabil către amputație", b: "Se caracterizează mai frecvent prin claudicație intermitentă stabilă", c: "Simptomatologia se poate ameliora pe măsura dezvoltării circulației colaterale", d: "Durerea de repaos și ishemia critică a membrului reprezintă indicații chirurgicale absolute", e: "Leziunile trofice distale sunt clasificate în stadiul IV Leriche-Fontaine" }, ans: ["b", "c", "d", "e"] },
        { id: "cm_96", sec: "cm", secTitle: "Complement Multiplu", num: "96", text: "Dintre complicațiile postoperatorii ce pot apărea după un by-pass femuro-popliteu sunt întâlnite următoarele complicații:", type: "cm", opts: { a: "tromboza grefonului", b: "hemoragia", c: "infecția", d: "Impotența sexuală", e: "Limforagia" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_97", sec: "cm", secTitle: "Complement Multiplu", num: "97", text: "Care din urmatoarele afirmatii sunt adevarate?", type: "cm", opts: { a: "AVC tranzitor reprezinta o indicatie ferma pentru endarterectomia carotidiana daca este asociat unei stenoze carotidine de peste 70%;", b: "Varsta nu contine in sine contraindicatie pentru interventie;", c: "Majotitatea AVC ischemice tranzitorii dureaza mai mult de 24 ore", d: "Majotitatea AVC ischemice tranzitorii dureaza mai putin de 24 ore;", e: "Pierderea vederea de acceasi parte cu leziunea (amaurozis fugax) este simptom caracteristic stenozei carotidine" }, ans: ["a", "b", "d", "e"] },
        { id: "cm_98", sec: "cm", secTitle: "Complement Multiplu", num: "98", text: "Simptomele caracteristice stenozei carotidiene sunt:", type: "cm", opts: { a: "slăbiciunea, amorțeala și stângăcia la nivelul membrelor contralaterale", b: "Pierderea vederii în aceeași parte cu leziunea (amaurozis fugax)", c: "Disfazia în cazul afectării emisferei dominante", d: "Acufene", e: "Pierderea vederii este caracteristică, pacientul descriind orbirea ca pe o perdea întunecată trasă de sus în jos" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_99", sec: "cm", secTitle: "Complement Multiplu", num: "99", text: "Complicatiile endarterectomiei carotidiene pot fi:", type: "cm", opts: { a: "AVC;", b: "Paralizie de nerv hipoglos, glosofaringian, facial sau laringeu recurent;", c: "Hematom;", d: "Amnezie", e: "IMA." }, ans: ["a", "b", "c", "e"] },
        { id: "cm_100", sec: "cm", secTitle: "Complement Multiplu", num: "100", text: "Ruptura anevrismului aortic infrarenal se produce mai des posterior în retroperitoneu. Semnele clinice sunt:", type: "cm", opts: { a: "soc", b: "prezenţa unei mase abdominale pulsatile", c: "durerea abdominală sau lombară", d: "hemoragia digestivă", e: "Hipotensiune" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_101", sec: "cm", secTitle: "Complement Multiplu", num: "101", text: "Dintre complicațiile care pot apărea în chirurgia electivă a anevrismelor de aortă infrarenală sunt întîlnite:", type: "cm", opts: { a: "Hemoragia intraoperatorie", b: "Şocul acut la declamparea aortei", c: "embolizarea in teritoriul carotidian", d: "lezarea ureterului", e: "embolizarea in patul arterial distal" }, ans: ["a", "b", "d", "e"] },
        { id: "cm_102", sec: "cm", secTitle: "Complement Multiplu", num: "102", text: "Principalele complicații ale anevrismelor periferice sunt:", type: "cm", opts: { a: "tromboza", b: "embolia distală", c: "ruptura", d: "hemoragia digestivă", e: "compresia venelor adiacente" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_103", sec: "cm", secTitle: "Complement Multiplu", num: "103", text: "Sindromul Klippel-Trenaunay se caracterizeaza prin:", type: "cm", opts: { a: "Alungirea hipertrofica a unui membru;", b: "Angioame plane dureroase;", c: "Varice congenitale;", d: "Fistule arteriovenoase macroscopice;", e: "Fistule arteriovenoase microscopice;" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_104", sec: "cm", secTitle: "Complement Multiplu", num: "104", text: "Sindromul Parks-Weber se manifestă prin:", type: "cm", opts: { a: "alungirea hipertrofică a unui membru", b: "angioame", c: "nevi vasculari", d: "Fistule arterio-venoase congenitale", e: "Varice" }, ans: ["a", "b", "c", "d"] },
        { id: "cm_105", sec: "cm", secTitle: "Complement Multiplu", num: "105", text: "Urmatoarele afirmaţii referitor la trombangeită sunt adevărate:", type: "cm", opts: { a: "Simpatectomie lombară este încă indicată pe scară largă.", b: "Atingerea distală și absenţa unui pat vascular distal nu permit o chirurgie de revascularizare a cuzurilor.", c: "Oprirea fumatului reprezintă tratamentului etiopatogenetic esențial.", d: "Revascularizarea chirurgicală este posibilă în marea majoritate a cazurilor.", e: "Oprirea fumatului scade rata și incidența amputațiilor." }, ans: ["a", "b", "c", "e"] },
        { id: "cm_106", sec: "cm", secTitle: "Complement Multiplu", num: "106", text: "Manifestările clinice caracteristice insuficienţei venoase cronice sunt:", type: "cm", opts: { a: "edemul", b: "pahidermita", c: "ulcer trofic", d: "eritroza de declivitate", e: "dermita ocră" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_107", sec: "cm", secTitle: "Complement Multiplu", num: "107", text: "Investigaţii paraclinice non-invazive în bolile venelor sunt:", type: "cm", opts: { a: "Fotopletismografia", b: "Examentul Doppler venos", c: "Flebografia", d: "Ecografia doppler venoasă", e: "Scintigrafia cu fibrinogen marcat radioactive." }, ans: ["a", "b", "d"] },
        { id: "cm_108", sec: "cm", secTitle: "Complement Multiplu", num: "108", text: "O multitudine de semne si simptome au fost descrise ca făcînd parte din tabloul clinic al trombozei venoase profunde:", type: "cm", opts: { a: "afebrilitatea", b: "pulsul cățărător-semnul Mahler", c: "durere spontană, localizată în molet, care se accentuează la palpare și la flexia dorsală a piciorului-semnul -Homans.", d: "dilatarea venelor cutanate pretibilae-smenul Pratt.", e: "sensibilitatea la palpare pe traiectil venos profund al gambei de la şanţul retromaleolar intern pînă în regiunea poplitee." }, ans: ["b", "c", "d", "e"] },
        { id: "cm_109", sec: "cm", secTitle: "Complement Multiplu", num: "109", text: "Indicaţiile plasării unui filtru cav sunt:", type: "cm", opts: { a: "Embolie pulmonară recurentă în ciuda anticoagulării adecvate", b: "Embolie pulmonară certă la pacienți la care tratamentul anticoagulant este contraindicate.", c: "Complicații ale tartamentului anticoagulant care obligă la oprirea tratamentului", d: "înaintea embolectomiei pulmonare", e: "în urma embolectomiei pulmonare." }, ans: ["a", "b", "c", "d"] },
        { id: "cm_110", sec: "cm", secTitle: "Complement Multiplu", num: "110", text: "Contraindicaţiile întreruperii venelor perforante insuficienţe sunt:", type: "cm", opts: { a: "boala arterial ocluzivă a membrului respective", b: "Infecția la nivelul ulcerului venos", c: "obezitatea morbidă", d: "clasa 4-6 CEAP de insuficienţă venoasă", e: "patologie severă asociată" }, ans: ["a", "b", "c", "e"] },
        { id: "cm_111", sec: "cm", secTitle: "Complement Multiplu", num: "111", text: "Tratamentul tromboflebitelor superficiale constă în:", type: "cm", opts: { a: "tratament antiinflamator nesteroidian", b: "contenție elastică", c: "antibioterapie", d: "Tratament anticoagulant cînd procesul trombotic este extins și la sistemul venos profund.", e: "tratamentul chirurgical în cazurile de extensie ascendentă la coapsă." }, ans: ["a", "b", "d", "e"] },
        { id: "cm_112", sec: "cm", secTitle: "Complement Multiplu", num: "112", text: "Umătoarele complicații pot parea ca urmare a traumatismului peretelui arterial:", type: "cm", opts: { a: "spasmul arterial", b: "tromboză", c: "embolie", d: "creşterea activității colagenazei", e: "durerea acută" }, ans: ["a", "b", "c"] },
        { id: "cm_113", sec: "cm", secTitle: "Complement Multiplu", num: "113", text: "Semnele clinice ale traumatismului arterial sunt:", type: "cm", opts: { a: "hemoragie externă", b: "limfedem", c: "hematom expansiv", d: "ischemie acută", e: "trill pallabil" }, ans: ["a", "c", "d", "e"] },
        { id: "cm_114", sec: "cm", secTitle: "Complement Multiplu", num: "114", text: "Acestea sunt opțiuni ale revascularizării chirurgicale în traumatismele vasculare deschise:", type: "cm", opts: { a: "arteriorafie sau venorafie laterala", b: "angioplastie cu petec venos.", c: "rezecție fără interpoziție unui conduct venos", d: "by-pass cu grefon venos.", e: "rezecție cu interpoziția unui conduct venos." }, ans: ["a", "b", "d", "e"] },
        { id: "cm_115", sec: "cm", secTitle: "Complement Multiplu", num: "115", text: "Care din următoarele este o cauză de ischemie acută?", type: "cm", opts: { a: "embolie", b: "traumatism arterial", c: "desecție arterială spontană sau iatrogenă", d: "vasodilatație", e: "vasospasm" }, ans: ["a", "b", "c", "e"] },
